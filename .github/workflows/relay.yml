name: Deploy leads relay

# Заливка прослойки (relay/) в Cloudflare Workers.
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — токен с правом «Edit Cloudflare Workers»
#   CLOUDFLARE_ACCOUNT_ID — id аккаунта (правая колонка дашборда, «Account ID»)
#   BOT_TOKEN             — токен бота от @BotFather
#   TELEGRAM_CHAT_ID      — куда присылать заявки (личный чат или группа)
# Пока секретов нет, workflow падает на шаге deploy — это ожидаемо и ни на что не влияет.

on:
  push:
    branches: [preview/github-pages]
    paths:
      - 'relay/**'
      - '.github/workflows/relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (сеть подменена, наружу ничего не уходит)
        run: node --test test/*.test.ts

      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push secrets to worker
        run: |
          printf '%s' "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN
          printf '%s' "$TELEGRAM_CHAT_ID" | npx wrangler secret put TELEGRAM_CHAT_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
