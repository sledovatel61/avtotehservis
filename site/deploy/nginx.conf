# АвтоТехСервис — nginx reverse proxy.
# Установить: /etc/nginx/sites-available/avtotehservis.conf → symlink в sites-enabled.
# Домен пока не зарегистрирован: заменить server_name и пути сертификатов при появлении домена.

# HTTP → HTTPS + Let's Encrypt challenge
server {
    listen 80;
    listen [::]:80;
    server_name _;   # ← заменить на реальный домен (например avtotehservis439.ru)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` вместо `http2 on;`: директива http2 появилась только в nginx 1.25.1,
    # а в Debian 12 nginx 1.22, в Ubuntu 22.04 — 1.18, в 24.04 — 1.24. Старый синтаксис
    # работает на всех; на nginx ≥1.25.1 он объявлен устаревшим, но продолжает действовать.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;   # ← заменить на реальный домен

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;   # ← заменить DOMAIN
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;     # ← заменить DOMAIN
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Загрузки: видео до 100 МБ + запас
    client_max_body_size 120m;   # видео до 100 МБ + постер до 15 МБ + multipart-запас

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Сборка Astro: хешированные имена — кеш на год
    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /fonts/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }
    location /img/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    # Медиа: приложение само отдаёт immutable/range; nginx не буферизует большие ответы на диск
    location /media/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        # IP-заголовки ПЕРЕЗАПИСЫВАЮТСЯ реальным адресом, клиентский X-Forwarded-For
        # не наследуем (см. подробный комментарий в location /).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Блокер ревью round5: было $proxy_add_x_forwarded_for — он ДОПИСЫВАЕТ реальный
        # адрес в конец, а клиентское (поддельное) значение оставляет первым. Приложение
        # ключует лимиты заявок/загрузок и блокировку входа по X-Real-IP либо ПОСЛЕДНЕМУ
        # элементу XFF, поэтому единственный прокси на хосте (доверенный nginx)
        # перезаписывает заголовок своим $remote_addr: подмена IP извне не работает.
        # Если позже появится второй прокси/CDN — пересмотреть это место и clientIp().
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Таймауты под загрузку видео с телефона (медленные каналы)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
