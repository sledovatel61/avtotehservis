<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 44" role="img" aria-label="АвтоТехСервис">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#142720"/>
      <stop offset=".55" stop-color="#0E1B16"/>
      <stop offset="1" stop-color="#0A120E"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C994"/>
      <stop offset=".5" stop-color="#E0A96D"/>
      <stop offset="1" stop-color="#C87F45"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2=".15" y2="1">
      <stop offset="0" stop-color="#F8F5EE"/>
      <stop offset=".58" stop-color="#E6E8E1"/>
      <stop offset="1" stop-color="#C7D3CC"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C994"/>
      <stop offset="1" stop-color="#C87F45"/>
    </linearGradient>
  </defs>

  <!-- фирменный щит-плашка -->
  <rect x="1" y="1" width="70" height="42" rx="11" fill="url(#shield)" stroke="url(#brass)" stroke-width="1.65"/>
  <rect x="3" y="3" width="66" height="38" rx="9.2" fill="none" stroke="#E0A96D" stroke-opacity=".24" stroke-width=".65"/>

  <!-- кузов суперкара по образцу визитки: клиновидный нос со сплиттером, низкая дуга купе, боковой заборник, острое антикрыло и диффузор -->
  <path fill="url(#body)" d="
    M 6.2 29.8
    L 9.6 28.5
    L 7.8 26.8
    C 10.6 24.4, 15.2 22.1, 20.8 20.3
    C 26.6 16.5, 33.4 14.9, 41.2 15.1
    C 47.6 15.3, 53.4 17.0, 58.2 19.3
    L 64.6 16.4
    L 62.6 20.3
    L 64.4 21.1
    L 63.8 23.6
    L 65.5 24.1
    L 63.4 28.0
    L 65.1 27.6
    L 62.4 29.8
    L 58.3 29.8
    A 6.6 6.6 0 0 0 45.1 29.8
    L 26.1 29.8
    A 6.5 6.5 0 0 0 13.1 29.8
    Z"/>

  <!-- тонкие дуги крыльев над арками -->
  <path d="M12.5 28.6 A 7.1 7.1 0 0 1 26.7 28.6" fill="none" stroke="#0E1B16" stroke-width=".65" stroke-opacity=".55"/>
  <path d="M44.5 28.6 A 7.2 7.2 0 0 1 58.9 28.6" fill="none" stroke="#0E1B16" stroke-width=".65" stroke-opacity=".55"/>

  <!-- узкое клиновидное остекление купе с косой стойкой -->
  <path fill="#0D1914" d="
    M 23.2 20.1
    C 28.2 17.1, 34.4 16.0, 41.2 16.3
    C 45.2 16.5, 48.8 17.4, 51.4 18.7
    L 45.4 20.8
    L 25.0 20.9
    Z"/>
  <line x1="36.2" y1="16.1" x2="33.8" y2="21.0" stroke="url(#body)" stroke-width="1.25"/>

  <!-- гранёная боковая подштамповка и треугольный воздухозаборник перед задним крылом -->
  <path fill="#0D1914" d="M 41.4 22.0 L 45.8 19.6 L 43.4 26.9 L 39.8 26.9 Z"/>
  <path d="M 26.8 23.2 L 41.4 22.0 M 27.6 26.9 L 43.2 26.9 L 45.8 19.6" fill="none" stroke="#0D1914" stroke-width=".85" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 28.0 28.4 L 43.6 28.4" fill="none" stroke="#0D1914" stroke-width=".7" stroke-opacity=".55" stroke-linecap="round"/>

  <!-- передний треугольный воздухозаборник бампера -->
  <polygon points="8.6,27.0 12.2,26.4 10.6,28.7" fill="#0D1914"/>

  <!-- колёса: шина + пятилучевой спортивный латунный диск -->
  <g>
    <circle cx="19.6" cy="29.4" r="5.5" fill="#0A120E"/>
    <circle cx="19.6" cy="29.4" r="4.25" fill="none" stroke="url(#rim)" stroke-width="1.05"/>
    <circle cx="19.6" cy="29.4" r="3.45" fill="#12221B"/>
    <g stroke="url(#rim)" stroke-width="1.05" stroke-linecap="round">
      <line x1="19.6" y1="29.4" x2="19.6" y2="25.5"/>
      <line x1="19.6" y1="29.4" x2="23.3" y2="28.2"/>
      <line x1="19.6" y1="29.4" x2="21.9" y2="32.55"/>
      <line x1="19.6" y1="29.4" x2="17.3" y2="32.55"/>
      <line x1="19.6" y1="29.4" x2="15.9" y2="28.2"/>
    </g>
    <circle cx="19.6" cy="29.4" r="1.15" fill="url(#rim)"/>

    <circle cx="51.7" cy="29.4" r="5.6" fill="#0A120E"/>
    <circle cx="51.7" cy="29.4" r="4.35" fill="none" stroke="url(#rim)" stroke-width="1.05"/>
    <circle cx="51.7" cy="29.4" r="3.55" fill="#12221B"/>
    <g stroke="url(#rim)" stroke-width="1.05" stroke-linecap="round">
      <line x1="51.7" y1="29.4" x2="51.7" y2="25.4"/>
      <line x1="51.7" y1="29.4" x2="55.5" y2="28.15"/>
      <line x1="51.7" y1="29.4" x2="54.05" y2="32.6"/>
      <line x1="51.7" y1="29.4" x2="49.35" y2="32.6"/>
      <line x1="51.7" y1="29.4" x2="47.9" y2="28.15"/>
    </g>
    <circle cx="51.7" cy="29.4" r="1.15" fill="url(#rim)"/>
  </g>

  <!-- тонкая опорная линия горизонта под автомобилем -->
  <path d="M 9.5 36.8 C 24 37.6, 48 37.6, 62.5 36.8" fill="none" stroke="url(#brass)" stroke-width=".95" stroke-linecap="round" stroke-opacity=".68"/>
</svg>
